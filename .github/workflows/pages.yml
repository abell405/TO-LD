# Builds and deploys the site to GitHub Pages, with a fresh METAR for each
# airport in METAR_IDS saved as metar.json next to index.html.
# Runs on every push to main, every 10 minutes, and on demand.
name: Deploy site with METAR

on:
  push:
    branches: [main]
  schedule:
    # Off the top of the hour (GitHub delays :00 runs most); KPGD routine METARs come out at :53
    - cron: "2-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  METAR_IDS: KPGD

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch METAR from aviationweather.gov
        run: |
          mkdir -p _site
          cp index.html README.md _site/
          touch _site/.nojekyll
          UA="TO-LD calculator (github.com/${{ github.repository }})"
          URL="https://aviationweather.gov/api/data/metar?ids=${METAR_IDS}&format=json&hours=3"
          valid() { python3 -c "import json,sys; d=json.load(open('$1')); sys.exit(0 if isinstance(d,list) and any(m.get('rawOb') for m in d) else 1)" 2>/dev/null; }
          ok=""
          for try in 1 2 3; do
            code=$(curl -sS --max-time 20 -A "$UA" -o metar.tmp -w "%{http_code}" "$URL" || echo "curl-error")
            if [ "$code" = "200" ] && valid metar.tmp; then ok=1; break; fi
            echo "Attempt $try: HTTP $code"; sleep $((try*10))
          done
          if [ -n "$ok" ]; then
            mv metar.tmp _site/metar.json
            raw=$(python3 -c "import json; d=json.load(open('_site/metar.json')); d.sort(key=lambda m: m.get('obsTime') or 0, reverse=True); print(d[0].get('rawOb'))")
            echo "::notice title=METAR OK::$raw"
          else
            # Keep the METAR that is already on the site rather than publishing nothing
            if curl -fsS --max-time 20 -o prev.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/metar.json" && valid prev.json; then
              mv prev.json _site/metar.json
              echo "::warning title=METAR not updated::aviationweather.gov returned HTTP $code; kept the previous METAR"
            else
              echo "[]" > _site/metar.json
              echo "::warning title=METAR unavailable::aviationweather.gov returned HTTP $code and no previous METAR was available"
            fi
          fi

      - name: Check the live NWS METAR source the page uses
        continue-on-error: true
        run: |
          h=$(curl -sS --max-time 20 -D - -o nws.json -H "Origin: https://${{ github.repository_owner }}.github.io" -A "TO-LD calculator (github.com/${{ github.repository }})" "https://api.weather.gov/stations/KPGD/observations?limit=25" | tr -d '\r')
          code=$(echo "$h" | head -1); cors=$(echo "$h" | grep -i '^access-control-allow-origin' || echo "no CORS header")
          raw=$(python3 -c "import json; f=json.load(open('nws.json'))['features']; r=[x['properties'] for x in f if x['properties'].get('rawMessage')]; print((r[0]['timestamp']+' '+r[0]['rawMessage']) if r else 'no raw METAR in last 25')" 2>/dev/null || echo "unreadable")
          echo "::notice title=NWS check::$code | $cors | $raw"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
